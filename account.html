<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión — Rizos Satinados</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%233E1B4D'/%3E%3Ctext x='50' y='68' font-family='Georgia, serif' font-size='58' font-style='italic' fill='%23FBF3EF' text-anchor='middle'%3ER%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="index.html" class="logo">Rizos <span>Satinados</span></a>
    <nav class="main-nav" id="main-nav">
      <a href="index.html">Inicio</a>
      <a href="index.html#gorritos">Gorritos</a>
      <a href="index.html#scrunchies">Scrunchies</a>
      <a href="index.html#beneficios">Beneficios</a>
      <a href="index.html#pedir">Cómo pedir</a>
      <a href="index.html#contacto">Contacto</a>
      <a href="myaccount.html">Mi cuenta</a>
    </nav>
    <div class="header-actions">
      <a href="myaccount.html" id="authLink" class="btn btn-primary btn-small">Mi cuenta</a>
    </div>
    <button type="button" class="cart-toggle" id="cartToggle" aria-label="Ver carrito">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.5 3h2l2.4 12.4a2 2 0 0 0 2 1.6h8.6a2 2 0 0 0 2-1.6L21 8H6"/></svg>
      <span class="cart-count" hidden>0</span>
    </button>
    <button class="nav-toggle" id="navToggle" aria-label="Abrir menú" aria-expanded="false" aria-controls="main-nav">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<main id="main">
  <section class="auth-section">
    <div class="wrap auth-wrap">
      <div class="auth-card">
        <div class="auth-tabs">
          <button type="button" class="auth-tab is-active" data-tab="login">Iniciar sesión</button>
          <button type="button" class="auth-tab" data-tab="register">Crear cuenta</button>
        </div>

        <div class="auth-social">
          <button type="button" class="btn btn-outline btn-social" data-provider="google">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="#4285F4" d="M23.5 12.27c0-.79-.07-1.54-.2-2.27H12v4.51h6.47a5.54 5.54 0 0 1-2.4 3.64v3h3.88c2.27-2.09 3.55-5.17 3.55-8.88Z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.07 7.94-2.9l-3.88-3a7.2 7.2 0 0 1-10.7-3.79H1.35v3.09A12 12 0 0 0 12 24Z"/><path fill="#FBBC05" d="M5.36 14.31a7.2 7.2 0 0 1 0-4.62V6.6H1.35a12 12 0 0 0 0 10.8l4.01-3.09Z"/><path fill="#EA4335" d="M12 4.77a6.52 6.52 0 0 1 4.61 1.8l3.44-3.44A11.6 11.6 0 0 0 12 0 12 12 0 0 0 1.35 6.6l4.01 3.09A7.2 7.2 0 0 1 12 4.77Z"/></svg>
            Continuar con Google
          </button>
          <button type="button" class="btn btn-outline btn-social" data-provider="github">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M12 .5A11.5 11.5 0 0 0 .5 12c0 5.1 3.29 9.43 7.86 10.96.58.1.79-.25.79-.56v-2.16c-3.2.7-3.87-1.36-3.87-1.36-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.2 1.77 1.2 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.51-1.47.11-3.06 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.8 0c2.2-1.5 3.18-1.18 3.18-1.18.62 1.6.23 2.77.11 3.06.74.81 1.19 1.83 1.19 3.09 0 4.41-2.7 5.38-5.26 5.67.41.36.78 1.08.78 2.18v3.22c0 .32.21.68.8.56A11.5 11.5 0 0 0 23.5 12 11.5 11.5 0 0 0 12 .5Z"/></svg>
            Continuar con GitHub
          </button>
        </div>
        <div class="auth-divider">o con tu email</div>

        <form id="loginForm" class="auth-form">
          <label>Email
            <input type="email" name="email" required autocomplete="email">
          </label>
          <label>Contraseña
            <input type="password" name="password" required autocomplete="current-password">
          </label>
          <p class="auth-error" id="loginError" hidden></p>
          <p class="auth-success" id="resetSuccess" hidden></p>
          <button type="submit" class="btn btn-primary">Iniciar sesión</button>
          <button type="button" class="auth-forgot" id="forgotBtn">¿Olvidaste tu contraseña?</button>
        </form>

        <form id="registerForm" class="auth-form" hidden>
          <label>Nombre
            <input type="text" name="full_name" required autocomplete="name">
          </label>
          <label>Email
            <input type="email" name="email" required autocomplete="email">
          </label>
          <label>Contraseña
            <input type="password" name="password" required minlength="6" autocomplete="new-password">
          </label>
          <p class="auth-error" id="registerError" hidden></p>
          <p class="auth-success" id="registerSuccess" hidden></p>
          <button type="submit" class="btn btn-primary">Crear cuenta</button>
        </form>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap footer-bottom">
    <p>© <span id="year"></span> Rizos Satinados. Diseño y costura artesanal en Montevideo.</p>
  </div>
</footer>

<div class="cart-backdrop" id="cartBackdrop"></div>
<aside class="cart-drawer" id="cartDrawer" aria-label="Carrito de compras">
  <div class="cart-drawer-head">
    <h2>Tu carrito</h2>
    <button type="button" class="cart-close" id="cartClose" aria-label="Cerrar carrito">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-footer">
    <div class="cart-total-row"><span>Total</span><span id="cartTotal">$ 0</span></div>
    <button type="button" class="btn btn-primary js-contact" id="cartCheckoutBtn" data-msg="" hidden>Finalizar por WhatsApp/Instagram</button>
  </div>
</aside>

<script src="js/script.js"></script>
<script type="module" src="js/account.js"></script>
<script type="module" src="js/cart.js"></script>
</body>
</html>
