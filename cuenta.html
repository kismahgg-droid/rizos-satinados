<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión — Rizos Satinados</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%233E1B4D'/%3E%3Ctext x='50' y='68' font-family='Georgia, serif' font-size='58' font-style='italic' fill='%23FBF3EF' text-anchor='middle'%3ER%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="index.html" class="logo">Rizos <span>Satinados</span></a>
    <nav class="main-nav" id="main-nav">
      <a href="index.html">Inicio</a>
      <a href="index.html#gorritos">Gorritos</a>
      <a href="index.html#scrunchies">Scrunchies</a>
      <a href="mi-cuenta.html">Mi cuenta</a>
    </nav>
    <div class="header-actions">
      <a href="mi-cuenta.html" id="authLink" class="btn btn-primary btn-small">Mi cuenta</a>
    </div>
    <button class="nav-toggle" id="navToggle" aria-label="Abrir menú" aria-expanded="false" aria-controls="main-nav">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<main id="main">
  <section class="auth-section">
    <div class="wrap auth-wrap">
      <div class="auth-card">
        <div class="auth-tabs">
          <button type="button" class="auth-tab is-active" data-tab="login">Iniciar sesión</button>
          <button type="button" class="auth-tab" data-tab="register">Crear cuenta</button>
        </div>

        <form id="loginForm" class="auth-form">
          <label>Email
            <input type="email" name="email" required autocomplete="email">
          </label>
          <label>Contraseña
            <input type="password" name="password" required autocomplete="current-password">
          </label>
          <p class="auth-error" id="loginError" hidden></p>
          <button type="submit" class="btn btn-primary">Iniciar sesión</button>
        </form>

        <form id="registerForm" class="auth-form" hidden>
          <label>Nombre
            <input type="text" name="full_name" required autocomplete="name">
          </label>
          <label>Email
            <input type="email" name="email" required autocomplete="email">
          </label>
          <label>Contraseña
            <input type="password" name="password" required minlength="6" autocomplete="new-password">
          </label>
          <p class="auth-hint">Con tu cuenta vas a poder ver tus pedidos, guardar favoritos y recibir avisos de stock.</p>
          <p class="auth-error" id="registerError" hidden></p>
          <p class="auth-success" id="registerSuccess" hidden></p>
          <button type="submit" class="btn btn-primary">Crear cuenta</button>
        </form>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap footer-bottom">
    <p>© <span id="year"></span> Rizos Satinados. Diseño y costura artesanal en Montevideo.</p>
  </div>
</footer>

<script src="js/script.js"></script>
<script type="module" src="js/account.js"></script>
</body>
</html>
